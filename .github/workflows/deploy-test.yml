# yaml
name: Deploy bundle to test

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_TEST_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_TEST_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t test

      - name: Deploy bundle
        run: databricks bundle deploy -t test

      - name: Run job
        run: databricks bundle run hello_dab_job -t test
